<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page)}.sw{display:flex;gap:0}.sw>div{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em}.row{display:flex;gap:16px;align-items:flex-end}.lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}</style></head><body><style>@keyframes s{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}</style>
<div style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;align-items:center;gap:14px"><span class="lb" style="width:120px">dur-fast · 130ms</span><span style="width:14px;height:14px;border-radius:50%;background:var(--teal-500);animation:s 1.6s var(--ease-in-out) infinite"></span></div><div style="display:flex;align-items:center;gap:14px"><span class="lb" style="width:120px">dur-base · 200ms</span><span style="width:14px;height:14px;border-radius:50%;background:var(--teal-500);animation:s 1.6s var(--ease-in-out) infinite"></span></div><div style="display:flex;align-items:center;gap:14px"><span class="lb" style="width:120px">dur-slow · 320ms</span><span style="width:14px;height:14px;border-radius:50%;background:var(--teal-500);animation:s 1.6s var(--ease-in-out) infinite"></span></div></div></body></html>
